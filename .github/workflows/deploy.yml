name: Deploy Chat App Wallet

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-chat-app-wallet-production
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_TARGET: /var/www/api.postoochat.com/public/wp-content/plugins/chat-app-wallet
    steps:
      - uses: actions/checkout@v4
      - name: Validate PHP syntax
        run: find plugin/chat-app-wallet -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.VULTR_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.VULTR_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Synchronize plugin
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: rsync -az --delete -e 'ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes' plugin/chat-app-wallet/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_TARGET/"
